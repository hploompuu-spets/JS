<!DOCTYPE html>
<html lang="et">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Broneeringud</title>
	<link rel="stylesheet" href="harj14.css">
	<script src="harj14.js" defer></script>
</head>
<body>
	<main class="page">
		<h1>Broneeringud</h1>
		<div class="table-controls">
			<label for="teenuse-filter">Filtreeri teenuse järgi</label>
			<select id="teenuse-filter">
				<option value="">Kõik teenused</option>
				<option value="Juuksur">Juuksur</option>
				<option value="Massaaž">Massaaž</option>
				<option value="Spa">Spa</option>
				<option value="Kosmeetika">Kosmeetika</option>
			</select>
			<p id="tulemuste-arv" aria-live="polite"></p>
		</div>
		<div class="table-wrap">
			<table id="broneeringud">
				<thead>
					<tr>
						<th scope="col">Klient</th>
						<th scope="col">Teenus</th>
						<th scope="col">Kuupäev</th>
						<th scope="col">Kellaaeg</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</main>
</body>
</html>
