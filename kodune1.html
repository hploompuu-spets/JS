<!DOCTYPE html>
<html lang="et">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Broneeringud</title>
	<link rel="stylesheet" href="kodune1.css">
	<script src="kodune1.js" defer></script>
</head>
<body>
	<main class="page">
		<h1>Broneeringud</h1>
		<div class="table-controls">
			<div class="filter-field">
				<label for="teenuse-filter">Teenus</label>
				<select id="teenuse-filter">
					<option value="">Kõik teenused</option>
					<option value="Juuksur">Juuksur</option>
					<option value="Massaaž">Massaaž</option>
					<option value="Spa">Spa</option>
					<option value="Kosmeetika">Kosmeetika</option>
				</select>
			</div>
			<div class="filter-field">
				<label for="kuupaeva-filter">Kuupäev</label>
				<input id="kuupaeva-filter" type="date">
			</div>
			<div class="filter-field">
				<label for="kliendi-filter">Klient</label>
				<input id="kliendi-filter" type="search" placeholder="Otsi nime järgi" autocomplete="off">
			</div>
			<p id="tulemuste-arv" aria-live="polite"></p>
		</div>
		<div class="table-wrap">
			<table id="broneeringud">
				<thead>
					<tr>
						<th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="klient">Klient <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
						<th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="teenus">Teenus <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
						<th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="kuupaev">Kuupäev <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
						<th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="aeg">Kellaaeg <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</main>
</body>
</html>
